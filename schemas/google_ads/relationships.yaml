source_name: google_ads
description: >
  Relacionamentos entre tabelas Stats (metricas) e Config (dimensoes) do
  Google Ads Data Transfer. Config tables tem snapshots diarios — sempre
  deduplicar com ROW_NUMBER antes de JOIN.

relationships:
  - name: "campaign_stats_to_campaign"
    from_table: "ads_CampaignStats_*"
    to_table: "ads_Campaign_*"
    join_key: "campaign_id"
    cardinality: "N:1"
    requires_dedup: true
    dedup_partition_by: "campaign_id"
    dedup_order_by: "_TABLE_SUFFIX DESC"
    useful_fields: [campaign_name, campaign_advertising_channel_type, campaign_status, campaign_bidding_strategy_type]
    gotcha: "ads_Campaign_* has daily snapshots — deduplicate with ROW_NUMBER before JOIN to avoid metric inflation"
    example_sql: |
      WITH campaign_dedup AS (
        SELECT *, ROW_NUMBER() OVER (PARTITION BY campaign_id ORDER BY _TABLE_SUFFIX DESC) AS rn
        FROM `{project_id}.{dataset}.ads_Campaign_*`
      )
      SELECT
        c.campaign_name,
        SUM(s.metrics_cost_micros) / 1000000.0 AS custo
      FROM `{project_id}.{dataset}.ads_CampaignStats_*` s
      JOIN campaign_dedup c ON s.campaign_id = c.campaign_id AND c.rn = 1
      WHERE s._TABLE_SUFFIX BETWEEN '20250101' AND '20250131'
      GROUP BY c.campaign_name

