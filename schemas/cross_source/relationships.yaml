description: >
  Relacionamentos cross-source — como combinar dados de fontes diferentes.
  Cross-source JOINs nao tem foreign keys diretas. A ligacao e feita via
  agregacao por data (alta confianca) ou via UTM parameters (media confianca).

alignment_rules:
  date_formats:
    ga4_bigquery: "event_date (STRING, formato YYYYMMDD sem hifens)"
    google_ads: "segments_date (STRING, formato YYYY-MM-DD com hifens)"
    meta_ads: "date_start (STRING, formato YYYY-MM-DD com hifens)"
    vtex: "dt (DATE, formato YYYY-MM-DD — coluna de particionamento; usar diretamente em BETWEEN)"
    shopify: "dt (DATE, formato YYYY-MM-DD — coluna de particionamento; usar diretamente em BETWEEN — mesmo formato que VTEX)"
    conversion_tip: "Use PARSE_DATE('%Y%m%d', event_date) para GA4 alinhar com os demais. Google Ads/Meta Ads/VTEX/Shopify: usar o campo de data nativo (PARSE_DATE ou dt diretamente). VTEX e Shopify ja sao DATE no mesmo formato — join direto por dt."
  currency:
    google_ads: "metrics_cost_micros — dividir por 1000000.0 para obter valor em moeda real"
    meta_ads: "spend — ja esta em moeda real (NAO dividir)"
    vtex: "total_value, price, selling_price, etc. — ja estao em reais (pipeline converteu centavos para reais — NAO dividir por 100)"
    shopify: "total_price, price, line_total, etc. — ja estao em moeda real (FLOAT direto da API Shopify — NAO converter)"
    normalization_tip: "Sempre converter cost_micros / 1000000.0 para Google Ads. Meta Ads, VTEX e Shopify ja estao em moeda real — usar diretamente. VTEX e Shopify podem ser somados diretamente sem conversao."

relationships:
  # =========================================================================
  # GA4 ↔ Google Ads — date-based (HIGH confidence)
  # =========================================================================
  - name: "ga4_gads_daily_spend_vs_sessions"
    sources: ["ga4_bigquery", "google_ads"]
    strategy: "date_based"
    confidence: "high"
    description: "Combinar metricas diarias do GA4 (sessoes, usuarios, conversoes) com gastos do Google Ads por dia"
    join_approach: "Agregar cada fonte por data, depois JOIN por data alinhada"
    required_conversions:
      - "GA4 event_date (YYYYMMDD) → PARSE_DATE('%Y%m%d', event_date) para tipo DATE"
      - "Google Ads segments_date (YYYY-MM-DD) → PARSE_DATE('%Y-%m-%d', segments_date) para tipo DATE"
      - "Google Ads metrics_cost_micros / 1000000.0 para moeda real"
    example_sql: |
      WITH ga4_daily AS (
        SELECT
          PARSE_DATE('%Y%m%d', event_date) AS data,
          COUNT(DISTINCT CONCAT(user_pseudo_id, (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id'))) AS sessoes,
          COUNT(DISTINCT user_pseudo_id) AS usuarios
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY data
      ),
      gads_daily AS (
        SELECT
          PARSE_DATE('%Y-%m-%d', segments_date) AS data,
          SUM(metrics_cost_micros) / 1000000.0 AS custo,
          SUM(metrics_clicks) AS cliques,
          SUM(metrics_impressions) AS impressoes
        FROM `{project_id}.{dataset_gads}.ads_CampaignStats_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_gads}' AND '{date_end_gads}'
        GROUP BY data
      )
      SELECT
        COALESCE(g.data, a.data) AS data,
        g.sessoes,
        g.usuarios,
        a.custo,
        a.cliques,
        a.impressoes
      FROM ga4_daily g
      FULL OUTER JOIN gads_daily a ON g.data = a.data
      ORDER BY data

  # =========================================================================
  # GA4 ↔ Google Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "ga4_gads_utm_campaign"
    sources: ["ga4_bigquery", "google_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar GA4 com Google Ads via nome de campanha (UTM campaign no GA4 = campaign_name no Google Ads)"
    join_approach: "Extrair campaign de event_params no GA4, JOIN com ads_Campaign para nome"
    required_conversions:
      - "GA4: extrair campaign de event_params via UNNEST"
      - "Google Ads: deduplicar ads_Campaign com ROW_NUMBER antes do JOIN"
      - "Google Ads: metrics_cost_micros / 1000000.0 para moeda real"
    caveat: "Depende de UTMs estarem configurados corretamente nas campanhas Google Ads. Se UTMs nao estiverem configurados, o campo campaign no GA4 sera (not set)"
    example_sql: |
      WITH ga4_campaigns AS (
        SELECT
          (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign') AS campaign_name,
          COUNT(DISTINCT CONCAT(user_pseudo_id, (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id'))) AS sessoes
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY campaign_name
      ),
      gads_campaigns AS (
        SELECT
          c.campaign_name,
          SUM(s.metrics_cost_micros) / 1000000.0 AS custo,
          SUM(s.metrics_clicks) AS cliques
        FROM `{project_id}.{dataset_gads}.ads_CampaignStats_*` s
        JOIN (
          SELECT *, ROW_NUMBER() OVER (PARTITION BY campaign_id ORDER BY _TABLE_SUFFIX DESC) AS rn
          FROM `{project_id}.{dataset_gads}.ads_Campaign_*`
        ) c ON s.campaign_id = c.campaign_id AND c.rn = 1
        WHERE s._TABLE_SUFFIX BETWEEN '{date_start_gads}' AND '{date_end_gads}'
        GROUP BY c.campaign_name
      )
      SELECT
        COALESCE(g.campaign_name, a.campaign_name) AS campanha,
        g.sessoes,
        a.custo,
        a.cliques
      FROM ga4_campaigns g
      FULL OUTER JOIN gads_campaigns a ON g.campaign_name = a.campaign_name
      ORDER BY a.custo DESC NULLS LAST

  # =========================================================================
  # GA4 ↔ Meta Ads — date-based (HIGH confidence)
  # =========================================================================
  - name: "ga4_meta_daily_spend_vs_sessions"
    sources: ["ga4_bigquery", "meta_ads"]
    strategy: "date_based"
    confidence: "high"
    description: "Combinar metricas diarias do GA4 (sessoes, usuarios) com gastos do Meta Ads por dia"
    join_approach: "Agregar cada fonte por data, depois JOIN por data alinhada"
    required_conversions:
      - "GA4 event_date (YYYYMMDD) → PARSE_DATE('%Y%m%d', event_date) para tipo DATE"
      - "Meta Ads date_start (YYYY-MM-DD) → PARSE_DATE('%Y-%m-%d', date_start) para tipo DATE"
      - "Meta Ads spend ja esta em moeda real — usar diretamente"
    example_sql: |
      WITH ga4_daily AS (
        SELECT
          PARSE_DATE('%Y%m%d', event_date) AS data,
          COUNT(DISTINCT CONCAT(user_pseudo_id, (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id'))) AS sessoes,
          COUNT(DISTINCT user_pseudo_id) AS usuarios
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY data
      ),
      meta_daily AS (
        SELECT
          PARSE_DATE('%Y-%m-%d', date_start) AS data,
          SUM(spend) AS custo,
          SUM(impressions) AS impressoes,
          SUM(link_clicks) AS cliques
        FROM `{project_id}.{dataset_meta}.meta_ads_insights_campaign_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_meta}' AND '{date_end_meta}'
        GROUP BY data
      )
      SELECT
        COALESCE(g.data, m.data) AS data,
        g.sessoes,
        g.usuarios,
        m.custo,
        m.impressoes,
        m.cliques
      FROM ga4_daily g
      FULL OUTER JOIN meta_daily m ON g.data = m.data
      ORDER BY data

  # =========================================================================
  # GA4 ↔ Meta Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "ga4_meta_utm_campaign"
    sources: ["ga4_bigquery", "meta_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar GA4 com Meta Ads via nome de campanha (UTM campaign no GA4 = campaign_name no Meta)"
    join_approach: "Extrair campaign de event_params no GA4, JOIN com campaign_name do Meta Ads"
    required_conversions:
      - "GA4: extrair campaign de event_params via UNNEST"
      - "Meta Ads: spend ja esta em moeda real"
    caveat: "Depende de UTMs estarem configurados nas campanhas Meta Ads. Se nao estiverem, o campo campaign no GA4 sera (not set)"
    example_sql: |
      WITH ga4_campaigns AS (
        SELECT
          (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign') AS campaign_name,
          COUNT(DISTINCT CONCAT(user_pseudo_id, (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id'))) AS sessoes
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY campaign_name
      ),
      meta_campaigns AS (
        SELECT
          campaign_name,
          SUM(spend) AS custo,
