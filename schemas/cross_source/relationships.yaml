  # =========================================================================
  # VTEX ↔ Shopify — date-based (HIGH confidence)
  # =========================================================================
  - name: "vtex_shopify_daily_revenue_comparison"
    sources: ["vtex", "shopify"]
    strategy: "date_based"
    confidence: "high"
    description: "Comparar receita e pedidos diarios entre VTEX e Shopify — ideal para empresas com as duas plataformas ou em migracao"
    join_approach: "Agregar cada plataforma por dt (DATE), depois JOIN por data — ambas ja usam dt no mesmo formato"
    required_conversions:
      - "VTEX dt e DATE (YYYY-MM-DD) — usar diretamente"
      - "Shopify dt e DATE (YYYY-MM-DD) — usar diretamente"
      - "VTEX total_value ja esta em reais — nenhuma conversao"
      - "Shopify total_price ja esta em reais — nenhuma conversao"
    caveat: "Este join faz sentido para empresas com lojas em ambas as plataformas (ex: B2B no VTEX + D2C no Shopify) ou durante migracao de plataforma. Ambas as colunas de data e moeda ja estao alinhadas — e o cross-source join mais direto disponivel."
    example_sql: |
      WITH vtex_daily AS (
        SELECT
          dt AS data,
          COUNT(DISTINCT order_id) AS pedidos_vtex,
          ROUND(SUM(total_value), 2) AS receita_vtex,
          ROUND(AVG(total_value), 2) AS ticket_medio_vtex
        FROM `{project_id}.{dataset_vtex}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND status = 'invoiced'
        GROUP BY dt
      ),
      shopify_daily AS (
        SELECT
          dt AS data,
          COUNT(DISTINCT order_id) AS pedidos_shopify,
          ROUND(SUM(total_price), 2) AS receita_shopify,
          ROUND(AVG(total_price), 2) AS ticket_medio_shopify
        FROM `{project_id}.{dataset_shopify}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND financial_status = 'paid'
        GROUP BY dt
      )
      SELECT
        COALESCE(v.data, s.data) AS data,
        COALESCE(v.pedidos_vtex, 0) AS pedidos_vtex,
        COALESCE(v.receita_vtex, 0) AS receita_vtex,
        COALESCE(s.pedidos_shopify, 0) AS pedidos_shopify,
        COALESCE(s.receita_shopify, 0) AS receita_shopify,
        -- Receita combinada das duas plataformas
        COALESCE(v.receita_vtex, 0) + COALESCE(s.receita_shopify, 0) AS receita_total,
        -- Participacao de cada plataforma
        ROUND(
          COALESCE(v.receita_vtex, 0) * 100.0
          / NULLIF(COALESCE(v.receita_vtex, 0) + COALESCE(s.receita_shopify, 0), 0),
          1
        ) AS pct_receita_vtex,
        ROUND(
          COALESCE(s.receita_shopify, 0) * 100.0
          / NULLIF(COALESCE(v.receita_vtex, 0) + COALESCE(s.receita_shopify, 0), 0),
          1
        ) AS pct_receita_shopify
      FROM vtex_daily v
      FULL OUTER JOIN shopify_daily s ON v.data = s.data
      ORDER BY data
