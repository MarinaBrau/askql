  # =========================================================================
  # Google Ads ↔ Meta Ads — date-based (HIGH confidence)
  # =========================================================================
  - name: "gads_meta_daily_spend_comparison"
    sources: ["google_ads", "meta_ads"]
    strategy: "date_based"
    confidence: "high"
    description: "Comparar gastos e metricas diarias entre Google Ads e Meta Ads"
    join_approach: "Agregar cada fonte por data, depois JOIN por data alinhada"
    required_conversions:
      - "Google Ads segments_date (YYYY-MM-DD) → PARSE_DATE('%Y-%m-%d', segments_date) para tipo DATE"
      - "Meta Ads date_start (YYYY-MM-DD) → PARSE_DATE('%Y-%m-%d', date_start) para tipo DATE"
      - "Google Ads metrics_cost_micros / 1000000.0 para moeda real"
      - "Meta Ads spend ja esta em moeda real"
    example_sql: |
      WITH gads_daily AS (
        SELECT
          PARSE_DATE('%Y-%m-%d', segments_date) AS data,
          SUM(metrics_cost_micros) / 1000000.0 AS custo_google,
          SUM(metrics_clicks) AS cliques_google,
          SUM(metrics_impressions) AS impressoes_google
        FROM `{project_id}.{dataset_gads}.ads_CampaignStats_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_gads}' AND '{date_end_gads}'
        GROUP BY data
      ),
      meta_daily AS (
        SELECT
          PARSE_DATE('%Y-%m-%d', date_start) AS data,
          SUM(spend) AS custo_meta,
          SUM(link_clicks) AS cliques_meta,
          SUM(impressions) AS impressoes_meta
        FROM `{project_id}.{dataset_meta}.meta_ads_insights_campaign_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_meta}' AND '{date_end_meta}'
        GROUP BY data
      )
      SELECT
        COALESCE(g.data, m.data) AS data,
        g.custo_google,
        m.custo_meta,
        g.custo_google + m.custo_meta AS custo_total,
        g.cliques_google,
        m.cliques_meta,
        g.impressoes_google,
        m.impressoes_meta
      FROM gads_daily g
      FULL OUTER JOIN meta_daily m ON g.data = m.data
      ORDER BY data

  # =========================================================================
  # VTEX ↔ Google Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "vtex_gads_utm_campaign"
    sources: ["vtex", "google_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar pedidos VTEX com gastos do Google Ads via utm_campaign — ROAS estimado por campanha"
    join_approach: "Agregar VTEX por utm_campaign (filtrar utm_source = 'google'), JOIN com gastos do Google Ads por campaign_name"
    required_conversions:
      - "VTEX: filtrar utm_source = 'google' e utm_campaign IS NOT NULL"
      - "VTEX: filtrar dt para partition pruning"
      - "Google Ads: metrics_cost_micros / 1000000.0 para moeda real"
      - "Google Ads: deduplicar ads_Campaign com ROW_NUMBER antes do JOIN"
    caveat: "Confianca media — depende de UTMs configurados nas campanhas Google Ads. Pedidos sem UTM nao aparecem. utm_campaign deve coincidir com campaign_name do Google Ads."
    example_sql: |
      WITH vtex_campanhas AS (
        SELECT
          utm_campaign,
          COUNT(DISTINCT order_id) AS pedidos,
          ROUND(SUM(total_value), 2) AS receita_vtex
        FROM `{project_id}.{dataset_vtex}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND status = 'invoiced'
          AND utm_source = 'google'
          AND utm_campaign IS NOT NULL
        GROUP BY utm_campaign
      ),
      gads_campanhas AS (
        SELECT
          c.campaign_name,
          ROUND(SUM(s.metrics_cost_micros) / 1000000.0, 2) AS custo_google
        FROM `{project_id}.{dataset_gads}.ads_CampaignStats_*` s
        JOIN (
          SELECT *, ROW_NUMBER() OVER (PARTITION BY campaign_id ORDER BY _TABLE_SUFFIX DESC) AS rn
          FROM `{project_id}.{dataset_gads}.ads_Campaign_*`
        ) c ON s.campaign_id = c.campaign_id AND c.rn = 1
        WHERE s._TABLE_SUFFIX BETWEEN '{date_start_gads}' AND '{date_end_gads}'
        GROUP BY c.campaign_name
      )
      SELECT
        COALESCE(v.utm_campaign, g.campaign_name) AS campanha,
        v.pedidos,
        v.receita_vtex,
        g.custo_google,
        ROUND(v.receita_vtex / NULLIF(g.custo_google, 0), 2) AS roas_estimado
      FROM vtex_campanhas v
      FULL OUTER JOIN gads_campanhas g ON v.utm_campaign = g.campaign_name
      ORDER BY v.receita_vtex DESC NULLS LAST

  # =========================================================================
  # VTEX ↔ Meta Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "vtex_meta_utm_campaign"
    sources: ["vtex", "meta_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar pedidos VTEX com gastos do Meta Ads via utm_campaign — ROAS estimado por campanha"
    join_approach: "Agregar VTEX por utm_campaign (filtrar utm_source = 'facebook' ou 'instagram'), JOIN com gastos do Meta Ads por campaign_name"
    required_conversions:
      - "VTEX: filtrar utm_source IN ('facebook', 'instagram') e utm_campaign IS NOT NULL"
      - "VTEX: filtrar dt para partition pruning"
      - "Meta Ads: spend ja esta em moeda real — usar diretamente"
      - "Meta Ads: filtrar _TABLE_SUFFIX para periodo equivalente"
    caveat: "Confianca media — depende de UTMs configurados nas campanhas Meta Ads. utm_source pode ser 'facebook', 'instagram' ou o nome definido na campanha. utm_campaign deve coincidir com campaign_name do Meta Ads."
    example_sql: |
      WITH vtex_campanhas AS (
        SELECT
          utm_campaign,
          COUNT(DISTINCT order_id) AS pedidos,
          ROUND(SUM(total_value), 2) AS receita_vtex
        FROM `{project_id}.{dataset_vtex}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND status = 'invoiced'
          AND utm_source IN ('facebook', 'instagram', 'meta')
          AND utm_campaign IS NOT NULL
        GROUP BY utm_campaign
      ),
      meta_campanhas AS (
        SELECT
          campaign_name,
          ROUND(SUM(spend), 2) AS custo_meta
        FROM `{project_id}.{dataset_meta}.meta_ads_insights_campaign_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_meta}' AND '{date_end_meta}'
        GROUP BY campaign_name
      )
      SELECT
        COALESCE(v.utm_campaign, m.campaign_name) AS campanha,
        v.pedidos,
        v.receita_vtex,
        m.custo_meta,
        ROUND(v.receita_vtex / NULLIF(m.custo_meta, 0), 2) AS roas_estimado
      FROM vtex_campanhas v
      FULL OUTER JOIN meta_campanhas m ON v.utm_campaign = m.campaign_name
      ORDER BY v.receita_vtex DESC NULLS LAST

  # =========================================================================
  # Shopify ↔ Google Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "shopify_gads_utm_campaign"
    sources: ["shopify", "google_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar pedidos Shopify com gastos do Google Ads via utm_campaign — ROAS estimado por campanha"
    join_approach: "Agregar Shopify por utm_campaign (filtrar utm_source = 'google'), JOIN com gastos do Google Ads por campaign_name"
    required_conversions:
      - "Shopify: filtrar utm_source = 'google' e utm_campaign IS NOT NULL e financial_status = 'paid'"
      - "Shopify: filtrar dt para partition pruning"
      - "Google Ads: metrics_cost_micros / 1000000.0 para moeda real"
      - "Google Ads: deduplicar ads_Campaign com ROW_NUMBER antes do JOIN"
    caveat: "Confianca media — depende de UTMs configurados nas campanhas Google Ads. has_utm = TRUE pode ser usado como filtro pre-existente no Shopify."
    example_sql: |
