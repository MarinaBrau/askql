          FROM `{project_id}.{dataset_gads}.ads_Campaign_*`
        ) c ON s.campaign_id = c.campaign_id AND c.rn = 1
        WHERE s._TABLE_SUFFIX BETWEEN '{date_start_gads}' AND '{date_end_gads}'
        GROUP BY c.campaign_name
      )
      SELECT
        COALESCE(s.utm_campaign, g.campaign_name) AS campanha,
        s.pedidos,
        s.receita_shopify,
        g.custo_google,
        ROUND(s.receita_shopify / NULLIF(g.custo_google, 0), 2) AS roas_estimado
      FROM shopify_campanhas s
      FULL OUTER JOIN gads_campanhas g ON s.utm_campaign = g.campaign_name
      ORDER BY s.receita_shopify DESC NULLS LAST

  # =========================================================================
  # Shopify ↔ Meta Ads — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "shopify_meta_utm_campaign"
    sources: ["shopify", "meta_ads"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar pedidos Shopify com gastos do Meta Ads via utm_campaign — ROAS estimado por campanha"
    join_approach: "Agregar Shopify por utm_campaign (filtrar utm_source em facebook/instagram/meta), JOIN com gastos do Meta Ads por campaign_name"
    required_conversions:
      - "Shopify: filtrar utm_source IN ('facebook', 'instagram', 'meta') e utm_campaign IS NOT NULL"
      - "Shopify: filtrar financial_status = 'paid' e dt para partition pruning"
      - "Meta Ads: spend ja esta em moeda real — usar diretamente"
    caveat: "Confianca media — depende de UTMs configurados nas campanhas Meta Ads. utm_source pode ser 'facebook', 'instagram' ou outro valor definido na campanha."
    example_sql: |
      WITH shopify_campanhas AS (
