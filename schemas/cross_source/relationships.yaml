  # =========================================================================
  # GA4 ↔ VTEX — date-based (HIGH confidence)
  # =========================================================================
  - name: "ga4_vtex_daily_sessions_vs_orders"
    sources: ["ga4_bigquery", "vtex"]
    strategy: "date_based"
    confidence: "high"
    description: "Combinar sessoes e usuarios do GA4 com pedidos e receita do VTEX por dia — funil de aquisicao a compra"
    join_approach: "Agregar GA4 por data e VTEX por dt, depois JOIN por data alinhada"
    required_conversions:
      - "GA4 event_date (YYYYMMDD STRING) → PARSE_DATE('%Y%m%d', event_date) para DATE"
      - "VTEX dt ja e DATE — usar diretamente"
      - "VTEX total_value ja esta em reais — nenhuma conversao monetaria"
    example_sql: |
      WITH ga4_daily AS (
        SELECT
          PARSE_DATE('%Y%m%d', event_date) AS data,
          COUNT(DISTINCT CONCAT(user_pseudo_id, CAST(
            (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING
          ))) AS sessoes,
          COUNT(DISTINCT user_pseudo_id) AS usuarios
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY data
      ),
      vtex_daily AS (
        SELECT
          dt AS data,
          COUNT(DISTINCT order_id) AS pedidos,
          ROUND(SUM(total_value), 2) AS receita,
          ROUND(AVG(total_value), 2) AS ticket_medio
        FROM `{project_id}.{dataset_vtex}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND status = 'invoiced'
        GROUP BY dt
      )
      SELECT
        COALESCE(g.data, v.data) AS data,
        g.sessoes,
        g.usuarios,
        v.pedidos,
        v.receita,
        v.ticket_medio,
        -- Taxa de conversao: pedidos / sessoes
        ROUND(v.pedidos * 100.0 / NULLIF(g.sessoes, 0), 2) AS taxa_conversao_pct
      FROM ga4_daily g
      FULL OUTER JOIN vtex_daily v ON g.data = v.data
      ORDER BY data

  # =========================================================================
  # GA4 ↔ VTEX — UTM-based (MEDIUM confidence)
  # =========================================================================
  - name: "ga4_vtex_utm_campaign"
    sources: ["ga4_bigquery", "vtex"]
    strategy: "utm_based"
    confidence: "medium"
    description: "Combinar sessoes do GA4 com pedidos do VTEX via utm_campaign — funil por campanha"
    join_approach: "Extrair campaign de event_params no GA4, JOIN com utm_campaign do VTEX"
    required_conversions:
      - "GA4: extrair campaign de event_params via UNNEST"
      - "VTEX: filtrar dt para partition pruning"
    caveat: "Confianca media — depende de UTMs configurados nas campanhas. GA4 captura o utm no primeiro/ultimo clique da sessao; VTEX captura no momento do pedido — pode haver divergencia."
    example_sql: |
      WITH ga4_campanhas AS (
        SELECT
          (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign') AS utm_campaign,
          COUNT(DISTINCT CONCAT(user_pseudo_id, CAST(
            (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING
          ))) AS sessoes
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY utm_campaign
      ),
      vtex_campanhas AS (
        SELECT
          utm_campaign,
          COUNT(DISTINCT order_id) AS pedidos,
          ROUND(SUM(total_value), 2) AS receita
        FROM `{project_id}.{dataset_vtex}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND status = 'invoiced'
          AND utm_campaign IS NOT NULL
        GROUP BY utm_campaign
      )
      SELECT
        COALESCE(g.utm_campaign, v.utm_campaign) AS campanha,
        g.sessoes,
        v.pedidos,
        v.receita,
        ROUND(v.pedidos * 100.0 / NULLIF(g.sessoes, 0), 2) AS taxa_conversao_pct,
        ROUND(v.receita / NULLIF(g.sessoes, 0), 2) AS receita_por_sessao
      FROM ga4_campanhas g
      FULL OUTER JOIN vtex_campanhas v ON g.utm_campaign = v.utm_campaign
      WHERE g.utm_campaign IS NOT NULL OR v.utm_campaign IS NOT NULL
      ORDER BY v.receita DESC NULLS LAST

  # =========================================================================
  # GA4 ↔ Shopify — date-based (HIGH confidence)
  # =========================================================================
  - name: "ga4_shopify_daily_sessions_vs_orders"
    sources: ["ga4_bigquery", "shopify"]
    strategy: "date_based"
    confidence: "high"
    description: "Combinar sessoes e usuarios do GA4 com pedidos e receita do Shopify por dia — funil de aquisicao a compra"
    join_approach: "Agregar GA4 por data e Shopify por dt, depois JOIN por data alinhada"
    required_conversions:
      - "GA4 event_date (YYYYMMDD STRING) → PARSE_DATE('%Y%m%d', event_date) para DATE"
      - "Shopify dt ja e DATE — usar diretamente"
      - "Shopify total_price ja esta em reais — nenhuma conversao monetaria"
    example_sql: |
      WITH ga4_daily AS (
        SELECT
          PARSE_DATE('%Y%m%d', event_date) AS data,
          COUNT(DISTINCT CONCAT(user_pseudo_id, CAST(
            (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING
          ))) AS sessoes,
          COUNT(DISTINCT user_pseudo_id) AS usuarios
        FROM `{project_id}.{dataset_ga4}.events_*`
        WHERE _TABLE_SUFFIX BETWEEN '{date_start_ga4}' AND '{date_end_ga4}'
        GROUP BY data
      ),
      shopify_daily AS (
        SELECT
          dt AS data,
          COUNT(DISTINCT order_id) AS pedidos,
          ROUND(SUM(total_price), 2) AS receita,
          ROUND(AVG(total_price), 2) AS ticket_medio
        FROM `{project_id}.{dataset_shopify}.orders_treated`
        WHERE dt BETWEEN '{date_start}' AND '{date_end}'
          AND financial_status = 'paid'
        GROUP BY dt
      )
      SELECT
        COALESCE(g.data, s.data) AS data,
        g.sessoes,
        g.usuarios,
        s.pedidos,
        s.receita,
        s.ticket_medio,
        -- Taxa de conversao: pedidos / sessoes
        ROUND(s.pedidos * 100.0 / NULLIF(g.sessoes, 0), 2) AS taxa_conversao_pct
      FROM ga4_daily g
      FULL OUTER JOIN shopify_daily s ON g.data = s.data
      ORDER BY data

